<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nod. contact</title>
    <link rel="stylesheet" href="styles.css?v=top-ribbon-1" />
  </head>
  <body class="page back">
    <a class="corner-link" href="index.html" aria-label="Go to the front page">front</a>
    <img class="logo" src="images/logo.png" alt="nod. logo" />

    <main class="split">
      <section class="panel left">
        <p class="note fade-up">I do not compute webpages.
I make them with brush and keyboard.
All are unique and will represent your bussiness as they are supposet do - no lies.
This is a servise for you - who live your life authenticaly
All needed to reach me is on the right hand side</p>
      </section>
      <section class="panel right">
        <div class="blur-bg" aria-hidden="true"></div>
        <form class="contact" method="post" action="#">
          <h2>Contact</h2>
          <label class="field">
            Sender
            <input type="text" name="sender" placeholder="Your name" />
          </label>
          <label class="field">
            E-mail
            <input type="email" name="email" placeholder="you@example.com" required />
          </label>
          <label class="field">
            Message
            <textarea name="message" placeholder="Tell me about your project" required></textarea>
          </label>
          <button class="send" type="submit">Send</button>
        </form>
      </section>
    </main>
    <p class="about-credit">© Рајко Стојановић</p>
  </body>
</html>
